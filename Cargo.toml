[package]
name = "earleybird"
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version. Floor is set by smol_str 0.3.6 (requires 1.89).
rust-version = "1.89"
default-run = "eb"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "eb"
path = "src/eb.rs"

[lib]
name = "earleybird"

[features]
# Install a counting global allocator (see src/alloc_count.rs) and print
# per-parse allocation deltas under `--stats`. Off by default (zero-cost: the
# system allocator is used and the counters stay at zero). Build the measuring
# binary with `cargo run --release --features alloc-count -- ...`.
alloc-count = []

[dependencies]
quick-xml = "0.40"
smol_str = "0.3.6"
indextree = "4.8.1"
log = "0.4.32"
env_logger = "0.11"
multimap = "0.10.1"
argh = "0.1.19"
unicode-character-database = "0.1.0"
itertools = "0.14.0"
indoc = "2.0.7"
